name: Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build and release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      # Only the submodules the released packages need. numpy/src is recursive
      # because meson/highway/pocketfft/... are nested submodules; pandas builds
      # against numpy, and matplotlib/pillow fetch their sdists themselves.
      - name: Init submodules
        run: |
          git submodule update --init cpython
          git submodule update --init --recursive numpy/src

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Capture toolchain cache key
        id: cachekey
        run: echo "cpython_sha=$(git -C cpython rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same key as the per-package build workflows so the toolchain cache is shared.
      - name: Cache wasi-sdk + cpython build
        id: toolchain-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            build/wasi-sdk
            cpython/builddir
          key: toolchain-${{ runner.os }}-${{ hashFiles('Makefile') }}-${{ steps.cachekey.outputs.cpython_sha }}

      - name: Build wasi-sdk + cpython (cache miss)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" "$(pwd)/cpython/builddir/wasi/install"

      # Build only the released packages, sequentially (each target still
      # parallelises internally) so a failure points at one package. contourpy
      # and kiwisolver are matplotlib's compiled runtime deps and ship with it;
      # pandas depends on the numpy build. make handles the ordering.
      - name: Build numpy
        run: make -j"$(nproc)" "$(pwd)/build/numpy-wasi.tar.gz"
      - name: Build pillow
        run: make -j"$(nproc)" "$(pwd)/build/pillow-wasi.tar.gz"
      - name: Build contourpy
        run: make -j"$(nproc)" "$(pwd)/build/contourpy-wasi.tar.gz"
      - name: Build kiwisolver
        run: make -j"$(nproc)" "$(pwd)/build/kiwisolver-wasi.tar.gz"
      - name: Build matplotlib
        run: make -j"$(nproc)" "$(pwd)/build/matplotlib-wasi.tar.gz"
      - name: Build pandas
        run: make -j"$(nproc)" "$(pwd)/build/pandas-wasi.tar.gz"
      - name: Build lxml
        run: make -j"$(nproc)" "$(pwd)/build/lxml-wasi.tar.gz"

      - name: Inspect release tarballs
        run: ls -lh build/*-wasi.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
            name: wasi-wheels
            path: build/*-wasi.tar.gz

      - name: Upload binary to Github release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/*-wasi.tar.gz
          file_glob: true
          tag: ${{ github.ref }}

  update_canary_release:
    name: Update canary release
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
            name: wasi-wheels

      - name: Delete canary tag
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: canary

      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            *.tar.gz
            *.txt
            *.whl
        if: github.ref == 'refs/heads/main'
