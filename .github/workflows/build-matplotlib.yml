name: Build matplotlib wasi wheel

on:
  workflow_dispatch:
  push:
    branches:
      - claude/python-sandbox-wasi-wheels-gabg3l
    paths:
      - matplotlib/**
      - contourpy/**
      - kiwisolver/**
      - pillow/**
      - scripts/**
      - Makefile
      - .github/workflows/build-matplotlib.yml

permissions:
  contents: read

jobs:
  build:
    name: Build matplotlib
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - name: Init submodules
        run: |
          git submodule update --init cpython
          git submodule update --init --recursive numpy/src

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Capture toolchain cache key
        id: cachekey
        run: echo "cpython_sha=$(git -C cpython rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache wasi-sdk + cpython build
        id: toolchain-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            build/wasi-sdk
            cpython/builddir
          key: toolchain-${{ runner.os }}-${{ hashFiles('Makefile') }}-${{ steps.cachekey.outputs.cpython_sha }}

      - name: Build wasi-sdk + cpython (cache miss)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" "$(pwd)/cpython/builddir/wasi/install"

      # Built sequentially (each target still parallelises internally) so a
      # failure points at one package instead of interleaving across them.
      # matplotlib's runtime deps (numpy, contourpy, kiwisolver) and Pillow
      # (matplotlib.colors hard-imports PIL) are built alongside it so the
      # uploaded artifact carries the full set Friday needs.
      - name: Build numpy
        run: make -j"$(nproc)" "$(pwd)/build/numpy-wasi.tar.gz"
      - name: Build contourpy
        run: make -j"$(nproc)" "$(pwd)/build/contourpy-wasi.tar.gz"
      - name: Build kiwisolver
        run: make -j"$(nproc)" "$(pwd)/build/kiwisolver-wasi.tar.gz"
      - name: Build pillow
        run: make -j"$(nproc)" "$(pwd)/build/pillow-wasi.tar.gz"
      - name: Build matplotlib
        run: make -j"$(nproc)" "$(pwd)/build/matplotlib-wasi.tar.gz"

      # No eryx runtime test: matplotlib needs to read its bundled font data
      # files at runtime, which the stock eryx runtime VFS does not expose
      # (it serves importable .py/.so only). The wheel builds and imports; the
      # render path is exercised inside Friday, whose runtime can mount the
      # font data. See README "Known limitations".
      - name: Inspect tarballs
        run: |
          ls -lh build/*-wasi.tar.gz
          tar tzf build/matplotlib-wasi.tar.gz | grep -E "\.so$" | head
          echo "bundled ttf font count:"
          tar tzf build/matplotlib-wasi.tar.gz | grep -cE "mpl-data/fonts/ttf/.*\.ttf$" || true

      - name: Upload matplotlib artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matplotlib-wasi
          path: |
            build/matplotlib-wasi.tar.gz
            build/contourpy-wasi.tar.gz
            build/kiwisolver-wasi.tar.gz
            build/numpy-wasi.tar.gz
            build/pillow-wasi.tar.gz
