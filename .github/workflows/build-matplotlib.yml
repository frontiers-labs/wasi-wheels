name: Build matplotlib wasi wheel

on:
  workflow_dispatch:
    inputs:
      eryx_version:
        description: eryx-precompile version to install
        required: false
        default: "0.4.9"
      cpu_target:
        description: AOT CPU target
        required: false
        default: x86-64-v2
  push:
    branches:
      - claude/python-sandbox-wasi-wheels-gabg3l
    paths:
      - matplotlib/**
      - contourpy/**
      - kiwisolver/**
      - pillow/**
      - scripts/**
      - Makefile
      - .github/workflows/build-matplotlib.yml

permissions:
  contents: read

env:
  ERYX_VERSION: ${{ inputs.eryx_version || '0.4.9' }}
  CPU_TARGET: ${{ inputs.cpu_target || 'x86-64-v2' }}
  ERYX_DEMO_ASSETS: https://github.com/eryx-org/eryx/releases/download/demo-assets

jobs:
  build:
    name: Build + runtime-test matplotlib
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false

      - name: Init submodules
        run: |
          git submodule update --init cpython
          git submodule update --init --recursive numpy/src

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Capture toolchain cache key
        id: cachekey
        run: echo "cpython_sha=$(git -C cpython rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache wasi-sdk + cpython build
        id: toolchain-cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            build/wasi-sdk
            cpython/builddir
          key: toolchain-${{ runner.os }}-${{ hashFiles('Makefile') }}-${{ steps.cachekey.outputs.cpython_sha }}

      - name: Build wasi-sdk + cpython (cache miss)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: make -j"$(nproc)" "$(pwd)/cpython/builddir/wasi/install"

      # Built sequentially (each target still parallelises internally) so a
      # failure points at one package instead of interleaving across them.
      - name: Build numpy
        run: make -j"$(nproc)" "$(pwd)/build/numpy-wasi.tar.gz"
      - name: Build contourpy
        run: make -j"$(nproc)" "$(pwd)/build/contourpy-wasi.tar.gz"
      - name: Build kiwisolver
        run: make -j"$(nproc)" "$(pwd)/build/kiwisolver-wasi.tar.gz"
      # matplotlib hard-imports PIL (matplotlib.colors does `from PIL import
      # Image` at module top level), so Pillow must be present at runtime.
      - name: Build pillow
        run: make -j"$(nproc)" "$(pwd)/build/pillow-wasi.tar.gz"
      - name: Build matplotlib
        run: make -j"$(nproc)" "$(pwd)/build/matplotlib-wasi.tar.gz"

      - name: Inspect tarballs
        run: |
          ls -lh build/*-wasi.tar.gz
          tar tzf build/matplotlib-wasi.tar.gz | grep -E "\.so$" | head
          echo "--- mpl-data presence ---"
          tar tzf build/matplotlib-wasi.tar.gz | grep -c "mpl-data/matplotlibrc" || true
          echo "ttf font count:"
          tar tzf build/matplotlib-wasi.tar.gz | grep -cE "mpl-data/fonts/ttf/.*\.ttf$" || true
          echo "sample ttf entries:"
          tar tzf build/matplotlib-wasi.tar.gz | grep -E "mpl-data/fonts/ttf/.*\.ttf$" | head || true
          echo "wasi font index entry:"
          tar tzf build/matplotlib-wasi.tar.gz | grep "_wasi_index.txt" || true

      - name: Upload matplotlib artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matplotlib-wasi
          path: |
            build/matplotlib-wasi.tar.gz
            build/contourpy-wasi.tar.gz
            build/kiwisolver-wasi.tar.gz
            build/numpy-wasi.tar.gz
            build/pillow-wasi.tar.gz

      - name: Install eryx-precompile
        run: |
          curl -fSL -o eryx-precompile.tar.xz \
            "https://github.com/eryx-org/eryx/releases/download/eryx-precompile-v${ERYX_VERSION}/eryx-precompile-x86_64-unknown-linux-gnu.tar.xz"
          tar -xf eryx-precompile.tar.xz
          sudo mv eryx-precompile-x86_64-unknown-linux-gnu/eryx-precompile /usr/local/bin/
          eryx-precompile --version

      - name: Download eryx demo assets (runtime + stdlib)
        run: |
          mkdir -p eryx-test && cd eryx-test
          curl -fSL -o runtime.wasm "${ERYX_DEMO_ASSETS}/runtime.wasm"
          curl -fSL -o python-stdlib.tar.zst "${ERYX_DEMO_ASSETS}/python-stdlib.tar.zst"
          tar --zstd -xf python-stdlib.tar.zst

      - name: Vendor pure-Python runtime deps into stdlib
        run: |
          cd eryx-test
          python -m pip download --no-deps --dest wheels \
            cycler fonttools packaging pyparsing python-dateutil six
          for whl in wheels/*.whl; do unzip -q -o "$whl" -d python-stdlib; done

      - name: Write matplotlib verify script
        run: |
          printf '%s\n' \
            "import os, io, traceback" \
            "os.environ['MPLBACKEND'] = 'Agg'" \
            "os.environ.setdefault('MPLCONFIGDIR', '/tmp')" \
            "import matplotlib" \
            "from matplotlib import font_manager as fmod" \
            "dp = str(matplotlib.get_data_path())" \
            "idx = os.path.join(dp, 'fonts', '_wasi_index.txt')" \
            "print('DIAG idx', idx, 'exists', os.path.exists(idx))" \
            "try:" \
            "    print('DIAG idx_firstline', repr(open(idx).readline()))" \
            "except Exception as e:" \
            "    print('DIAG idx_open_err', repr(e))" \
            "one = os.path.join(dp, 'fonts', 'ttf', 'DejaVuSans.ttf')" \
            "print('DIAG font_exists', os.path.exists(one))" \
            "import matplotlib.ft2font as ft" \
            "try:" \
            "    f = ft.FT2Font(one); print('DIAG ft2font_path_ok', f.family_name)" \
            "except Exception:" \
            "    print('DIAG ft2font_path_err'); traceback.print_exc()" \
            "try:" \
            "    fh = open(one, 'rb'); f = ft.FT2Font(fh); print('DIAG ft2font_bytes_ok', f.family_name)" \
            "except Exception:" \
            "    print('DIAG ft2font_bytes_err'); traceback.print_exc()" \
            "print('DIAG ttflist', len(fmod.fontManager.ttflist))" \
            "print('DIAG DONE')" \
            > eryx-test/verify_mpl.py
          echo '--- verify_mpl.py ---'; cat eryx-test/verify_mpl.py

      - name: Runtime-test matplotlib via eryx-precompile
        run: |
          eryx-precompile compile eryx-test/runtime.wasm \
            -o eryx-test/matplotlib-test.cwasm \
            --preinit \
            --stdlib eryx-test/python-stdlib \
            --package build/numpy-wasi.tar.gz \
            --package build/kiwisolver-wasi.tar.gz \
            --package build/contourpy-wasi.tar.gz \
            --package build/pillow-wasi.tar.gz \
            --package build/matplotlib-wasi.tar.gz \
            --import numpy \
            --import PIL.Image \
            --import PIL.PngImagePlugin \
            --import matplotlib \
            --import matplotlib.pyplot \
            --import matplotlib.backends.backend_agg \
            --target "${CPU_TARGET}" \
            --verify-code "$(cat eryx-test/verify_mpl.py)"
